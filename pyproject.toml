[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Runtime dependencies for the imported XMUM Campus Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "nltk>=3.10.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "supabase>=2.34.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
